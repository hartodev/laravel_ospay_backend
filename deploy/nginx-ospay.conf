# Salin ke /etc/nginx/sites-available/ospay lalu ganti ospay.ptutamacta.com dan versi PHP-FPM
server {
    listen 80;
    server_name ospay.ptutamacta.com *.ospay.ptutamacta.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ospay.ptutamacta.com *.ospay.ptutamacta.com;

    ssl_certificate     /etc/letsencrypt/live/ospay.ptutamacta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ospay.ptutamacta.com/privkey.pem;

    root /var/www/ospay/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
